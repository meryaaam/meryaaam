name: generate snake

on:
  schedule:
    - cron: "0 0 * * *"   # every day
  workflow_dispatch:      # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Burgundy snake; one file that reads well on light and dark GitHub themes
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#B03052&color_dots=#2B0A13,#5E1027,#800020,#A01C40,#D14A6E

      - name: Commit snake into assets/
        run: |
          cp dist/github-contribution-grid-snake.svg assets/github-contribution-grid-snake.svg
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg
          git diff --cached --quiet || git commit -m "Update contribution snake"
          git push